name: Build NEXUS Desktop APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project files
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/nexus/desktop
          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "NEXUS-Desktop"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.nexus.desktop"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.nexus.desktop"
                  minSdk = 34
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1.0"
              }
              buildTypes {
                  release { isMinifyEnabled = false }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:allowBackup="false"
                  android:label="NEXUS Desktop"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:supportsRtl="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/nexus/desktop/MainActivity.kt <<'EOF'
          package com.nexus.desktop

          import android.app.Activity
          import android.hardware.display.DisplayManager
          import android.os.Bundle
          import android.view.Display
          import android.view.ViewGroup
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import java.text.DecimalFormat

          class MainActivity : Activity(), DisplayManager.DisplayListener {
              private lateinit var dm: DisplayManager
              private lateinit var result: TextView
              private val fmt = DecimalFormat("0.##")

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  dm = getSystemService(DISPLAY_SERVICE) as DisplayManager

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(24, 24, 24, 24)
                      setBackgroundColor(0xFF101820.toInt())
                  }
                  root.addView(TextView(this).apply {
                      text = "NEXUS Desktop"
                      textSize = 28f
                      setTextColor(0xFFFFFFFF.toInt())
                  })
                  root.addView(TextView(this).apply {
                      text = "Core + Display Engine | Prototype 0.1.0"
                      textSize = 13f
                      setTextColor(0xFF9FB3C8.toInt())
                      setPadding(0, 4, 0, 18)
                  })
                  root.addView(Button(this).apply {
                      text = "สแกนจออีกครั้ง"
                      setOnClickListener { scan() }
                  })
                  result = TextView(this).apply {
                      textSize = 14f
                      setTextColor(0xFFE6EDF3.toInt())
                      setTextIsSelectable(true)
                      setPadding(0, 16, 0, 16)
                  }
                  root.addView(result, LinearLayout.LayoutParams(
                      ViewGroup.LayoutParams.MATCH_PARENT, 0, 1f
                  ))
                  root.addView(TextView(this).apply {
                      text = "รุ่นนี้ใช้ตรวจสอบจอเท่านั้น ยังไม่ย้ายแอปไปจอภายนอกหรือเปลี่ยน Refresh Rate และไม่ข้าม DRM/FLAG_SECURE"
                      textSize = 12f
                      setTextColor(0xFF9FB3C8.toInt())
                  })
                  setContentView(ScrollView(this).apply { addView(root) })
                  scan()
              }

              override fun onResume() {
                  super.onResume()
                  dm.registerDisplayListener(this, null)
                  scan()
              }

              override fun onPause() {
                  dm.unregisterDisplayListener(this)
                  super.onPause()
              }

              override fun onDisplayAdded(id: Int) = scan()
              override fun onDisplayRemoved(id: Int) = scan()
              override fun onDisplayChanged(id: Int) = scan()

              private fun scan() {
                  val all = dm.displays
                  val s = StringBuilder()
                  s.append("รุ่นโทรศัพท์: ${android.os.Build.MODEL}\n")
                  s.append("Android: ${android.os.Build.VERSION.RELEASE} (API ${android.os.Build.VERSION.SDK_INT})\n")
                  s.append("จำนวนจอที่ระบบรายงาน: ${all.size}\n")
                  s.append("\n================================\n")
                  all.sortedBy { it.displayId }.forEachIndexed { i, d ->
                      s.append("\nจอที่ ${i + 1}\n")
                      s.append("ชื่อ: ${d.name}\n")
                      s.append("Display ID: ${d.displayId}\n")
                      s.append("ประเภท: ${if (d.displayId == Display.DEFAULT_DISPLAY) "จอหลักโทรศัพท์" else "จอเพิ่มเติม / Virtual / External"}\n")
                      s.append("สถานะ: ${state(d.state)}\n")
                      s.append("ขนาด: ${d.mode.physicalWidth} × ${d.mode.physicalHeight}\n")
                      s.append("Refresh Rate: ${fmt.format(d.refreshRate)} Hz\n")
                      s.append("Density: ${d.metrics.densityDpi} dpi\n")
                      s.append("FLAG_PRESENTATION: ${(d.flags and Display.FLAG_PRESENTATION) != 0}\n")
                      s.append("FLAG_SECURE: ${(d.flags and Display.FLAG_SECURE) != 0}\n")
                      s.append("โหมดที่รองรับ:\n")
                      d.supportedModes.forEach { m ->
                          s.append(" • ${m.physicalWidth}×${m.physicalHeight} @ ${fmt.format(m.refreshRate)} Hz\n")
                      }
                      s.append("--------------------------------\n")
                  }
                  s.append("\nข้อมูลขึ้นอยู่กับสิทธิ์ที่ OriginOS เปิดให้แอปเข้าถึง")
                  runOnUiThread { result.text = s.toString() }
              }

              private fun state(v: Int) = when (v) {
                  Display.STATE_ON -> "ON"
                  Display.STATE_OFF -> "OFF"
                  Display.STATE_DOZE -> "DOZE"
                  Display.STATE_DOZE_SUSPEND -> "DOZE_SUSPEND"
                  Display.STATE_UNKNOWN -> "UNKNOWN"
                  else -> "OTHER ($v)"
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Desktop-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
