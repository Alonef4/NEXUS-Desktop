name: build-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk FreeDesk-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: FreeDesk-apk
          path: FreeDesk-${{ github.run_number }}.apk
      # A release page is easy to open from a phone browser and tap-to-download.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: FreeDesk build ${{ github.run_number }}
          prerelease: true
          files: FreeDesk-${{ github.run_number }}.apk
