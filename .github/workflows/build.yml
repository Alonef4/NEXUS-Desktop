      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NEXUS-Desktop-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-Desktop-debug
          path: NEXUS-Desktop-${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Publish release (easy download from a phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NEXUS Desktop build ${{ github.run_number }}
          prerelease: true
          files: NEXUS-Desktop-${{ github.run_number }}.apk
